# Arquivo principal de configuração do Prometheus
# Referenciado no doker-co pose na linha:
#   --config.file=/etc/prometheus/prometheus.yml
# Define de quanto em quanto tempo as métrica são coletada e quais
# são as ferramentas que serão consultadas para extrair as métricas, 
# note que neste arquivo temos as ferramentas(targes): Mysql-exporter,
# CAdvisor. Prometheus
global:
# Intervalo padrão entre as coletas das métrica. A cada 15s segundos o 
# Prometheus acessa as ferramentas e coleta dados delas.
  scrape_interval: 15s
# Intervalo em que o Prometheus avalia as regras de acesso e coleta dados
  evaluation_interval: 15s

# Área de configuração das ferramentas que fornecem métricas ao prometheus
scrape_configs:
# job_name é o nome que aparece ao selecionar uma query(consulta) relacionada
# a esta ferramenta.
# target é a ferramenta que será acessada para coletar os dados de métricas
# e passará ao prometheus
  - job_name: mysql
    static_configs:
      - targets:
        - mysql-exporter:9104

  - job_name: cadvisor
    static_configs:
      - targets:
        - cadvisor:8080
  
  - job_name: prometheus
    static_configs:
      - targets:
        - prometheus:9090
